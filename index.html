  <!-- Fond posé avant Tailwind : évite un flash blanc au chargement -->
  <style>html { background: #071114 }</style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>

  <style type="text/tailwindcss">
    /* 1. Primitives : valeurs brutes */
    :root {
      --ink-950: #071114;
      --ink-800: #122226;
      --ink-400: #8fa6ab;
      --ink-50: #eef4f5;
      --teal-400: #13b5c5;
      --green-500: #4caf50;
    }

    /* 2. Sémantique : rôles, utilisés en classes (bg-page, text-muted, border-line…) */
    @theme inline {
      --font-sans: "Montserrat", ui-sans-serif, system-ui, sans-serif;
      --color-page: var(--ink-950);
      --color-raised: var(--ink-800);
      --color-fg: var(--ink-50);
      --color-muted: var(--ink-400);
      --color-line: color-mix(in srgb, var(--ink-50) 12%, transparent);
      --color-accent: var(--teal-400);
      --color-online: var(--green-500);
    }

    /* 3. Composant : ligne de lien */
    @utility link-row {
      @apply flex min-h-16 items-center gap-4 rounded-sm transition-colors duration-200 motion-reduce:transition-none
        focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent;
    }
  </style>
</head>
