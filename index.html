<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Izukend, web developer. Instagram, Twitch and GitHub.">
  <meta name="theme-color" content="#071114">
  <title>Izukend</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap">

  <!-- Fond posé avant Tailwind : évite un flash blanc au chargement -->
  <style>html { background: #071114 }</style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.13"></script>

  <style type="text/tailwindcss">
    /* 1. Primitives : valeurs brutes */
    :root {
      --ink-950: #071114;
      --ink-800: #122226;
      --ink-400: #8fa6ab;
      --ink-50: #eef4f5;
      --teal-400: #13b5c5;
      --green-500: #4caf50;
    }

    /* 2. Sémantique : rôles, utilisés en classes (bg-page, text-muted, border-line…) */
    @theme inline {
      --font-sans: "Montserrat", ui-sans-serif, system-ui, sans-serif;
      --color-page: var(--ink-950);
      --color-raised: var(--ink-800);
      --color-fg: var(--ink-50);
      --color-muted: var(--ink-400);
      --color-line: color-mix(in srgb, var(--ink-50) 12%, transparent);
      --color-accent: var(--teal-400);
      --color-online: var(--green-500);
    }

    /* 3. Composant : ligne de lien */
    @utility link-row {
      @apply flex min-h-16 items-center gap-4 rounded-sm transition-colors duration-200 motion-reduce:transition-none
        focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent;
    }
  </style>
</head>

<body class="bg-page font-sans text-fg antialiased">
  <main class="mx-auto flex min-h-dvh w-full max-w-sm flex-col justify-center px-6 py-12">

    <!-- Profil -->
    <header class="flex flex-col items-center text-center">
      <div class="relative">
        <img
          src="https://64.media.tumblr.com/e0fb1da5e02ab1e02b951c88acce4407/70dada4db0c9cd19-9a/s540x810/5f8b14fb0f3ae42894d96154a085421d389d213a.gifv"
          alt="Izukend's avatar"
          width="104" height="104"
          class="size-26 rounded-full bg-raised object-cover ring-1 ring-line ring-offset-4 ring-offset-page"
        >
        <span class="absolute bottom-1 right-1 size-3.5 rounded-full border-2 border-page bg-online" role="img" aria-label="Online"></span>
      </div>

      <h1 class="mt-8 text-3xl font-light tracking-tight">Izukend</h1>
      <p class="mt-2 text-sm text-muted">Web Developer</p>
    </header>

    <!-- Liens -->
    <section class="mt-12" aria-labelledby="links-title">
      <h2 id="links-title" class="text-sm text-muted">Connect with me</h2>

      <ul class="mt-3 divide-y divide-line border-y border-line">
        <li>
          <a href="https://www.instagram.com/izukend_kuruko?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" rel="noopener noreferrer" class="link-row group hover:text-accent">
            <svg class="size-5 shrink-0 text-muted transition-colors duration-200 group-hover:text-accent motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
              <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" /><circle cx="12" cy="12" r="4.25" /><path d="M17.3 6.7h.01" stroke-width="2.25" />
            </svg>
            <span class="font-medium">Instagram</span>
            <span class="ml-auto truncate text-sm text-muted">izukend_kuruko</span>
            <svg class="size-4 shrink-0 text-muted transition duration-200 group-hover:translate-x-0.5 group-hover:text-accent motion-reduce:transform-none motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
          </a>
        </li>
        <li>
          <a href="https://www.twitch.tv/izukendk" target="_blank" rel="noopener noreferrer" class="link-row group hover:text-accent">
            <svg class="size-5 shrink-0 text-muted transition-colors duration-200 group-hover:text-accent motion-reduce:transition-none" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0 1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z" />
            </svg>
            <span class="font-medium">Twitch</span>
            <span class="ml-auto truncate text-sm text-muted">izukendk</span>
            <svg class="size-4 shrink-0 text-muted transition duration-200 group-hover:translate-x-0.5 group-hover:text-accent motion-reduce:transform-none motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
          </a>
        </li>
        <li>
          <a href="https://github.com/Izukend" target="_blank" rel="noopener noreferrer" class="link-row group hover:text-accent">
            <svg class="size-5 shrink-0 text-muted transition-colors duration-200 group-hover:text-accent motion-reduce:transition-none" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
            </svg>
            <span class="font-medium">GitHub</span>
            <span class="ml-auto truncate text-sm text-muted">Izukend</span>
            <svg class="size-4 shrink-0 text-muted transition duration-200 group-hover:translate-x-0.5 group-hover:text-accent motion-reduce:transform-none motion-reduce:transition-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9" /></svg>
          </a>
        </li>
      </ul>
    </section>

    <!-- Jeux récents (Discord via Lanyard) : masqué tant qu'il n'y a rien à afficher.
         data-discord-id : ton ID Discord. data-ignore : applis à ne pas compter comme jeux, séparées par | -->
    <section id="games" class="mt-10" aria-labelledby="games-title" hidden
      data-discord-id=""
      data-ignore="Visual Studio Code|Code|Cursor|WebStorm|Figma">
      <h2 id="games-title" class="text-sm text-muted">Recently played</h2>
      <ul class="mt-3 divide-y divide-line border-y border-line"></ul>
      <template>
        <li class="flex min-h-16 items-center gap-4">
          <span class="relative flex size-9 shrink-0 items-center justify-center overflow-hidden rounded-sm bg-raised text-sm text-muted" aria-hidden="true">
            <span data-initial></span>
            <img data-image alt="" width="36" height="36" loading="lazy" class="absolute inset-0 size-full object-cover" hidden>
          </span>
          <span data-name class="truncate font-medium"></span>
          <span data-when class="ml-auto shrink-0 text-sm text-muted"></span>
        </li>
      </template>
    </section>

    <!-- Statut -->
    <footer class="mt-10 flex items-center justify-center gap-2 text-sm text-muted">
      <svg class="size-4 text-accent" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5" /></svg>
      Playing coding time
    </footer>
  </main>
  <script>
    (() => {
      const section = document.getElementById("games");
      const { discordId, ignore } = section.dataset;
      if (!discordId) return;

      const list = section.querySelector("ul");
      const template = section.querySelector("template");
      const ignored = ignore.split("|");
      const relative = new Intl.RelativeTimeFormat("en", { numeric: "auto" });

      const ago = (time) => {
        const minutes = Math.max(0, Math.round((Date.now() - time) / 60000));
        if (minutes < 60) return relative.format(-minutes, "minute");
        if (minutes < 1440) return relative.format(-Math.round(minutes / 60), "hour");
        return relative.format(-Math.round(minutes / 1440), "day");
      };

      const row = ({ name, image, last }) => {
        const li = template.content.cloneNode(true);
        li.querySelector("[data-initial]").textContent = name.charAt(0).toUpperCase();
        li.querySelector("[data-name]").textContent = name;
        const when = li.querySelector("[data-when]");
        when.textContent = last ? ago(last) : "Playing now";
        if (!last) when.classList.replace("text-muted", "text-online");
        if (/^https:/.test(image ?? "")) {
          const img = li.querySelector("[data-image]");
          img.onerror = () => { img.hidden = true; };
          img.src = image;
          img.hidden = false;
        }
        return li;
      };

      const refresh = async () => {
        try {
          const res = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
          if (!res.ok) return;
          const { data } = await res.json();

          let history = [];
          try { history = JSON.parse(data.kv?.recent_games ?? "[]"); } catch {}
          if (!Array.isArray(history)) history = [];

          const playing = data.activities
            .filter((a) => a.type === 0 && !ignored.includes(a.name))
            .map((a) => ({ name: a.name, image: history.find((g) => g.name === a.name)?.image }));
          const past = history.filter((g) => g?.name && g.last && !playing.some((p) => p.name === g.name));

          const games = [...playing, ...past].slice(0, 5);
          list.replaceChildren(...games.map(row));
          section.hidden = !games.length;
        } catch { /* Lanyard injoignable : on garde l'affichage actuel */ }
      };

      refresh();
      setInterval(() => { if (!document.hidden) refresh(); }, 60000);
    })();
  </script>
</body>
</html>
